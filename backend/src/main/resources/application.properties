# ----------------------------------------------------------------------
# 1. LIMPEZA E CONFIGURAÇÃO BÁSICA
# ----------------------------------------------------------------------

# Porta da aplicação (Padrão)
server.port=8080

# ----------------------------------------------------------------------
# 2. CONFIGURAÇÃO DO BANCO DE DADOS H2 (EM MEMÓRIA)
# ----------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:crudmongo
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa

# Console do H2 habilitado (Para checar as tabelas no browser)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ----------------------------------------------------------------------
# 3. JPA / HIBERNATE
# ----------------------------------------------------------------------

# DDL Auto: Cria ou atualiza as tabelas automaticamente (essencial para o H2 em memória)
spring.jpa.hibernate.ddl-auto=update

# Logging SQL COMPLETO (Mostra as consultas no console)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

